services:
  train:
    build: .
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts
      - ./config:/app/config:ro
    command: python scripts/train.py
    profiles:
      - train

  api:
    build: .
    environment:
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
